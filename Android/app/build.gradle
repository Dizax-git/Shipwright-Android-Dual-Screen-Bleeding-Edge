def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
def generatedCanonicalAssets = layout.buildDirectory.dir('generated/canonicalAssets')
def androidVersionProperties = new Properties()
def androidVersionFile = rootProject.file('version.properties')
if (!androidVersionFile.isFile()) {
    throw new GradleException("Missing Android version manifest: ${androidVersionFile}")
}
androidVersionFile.withInputStream { androidVersionProperties.load(it) }
def androidVersionName = androidVersionProperties.getProperty('versionName')
def androidVersionCode = androidVersionProperties.getProperty('versionCode')?.toInteger()
def releaseTag = androidVersionProperties.getProperty('releaseTag')
if (!androidVersionName || !androidVersionCode || !releaseTag) {
    throw new GradleException('version.properties must define versionName, versionCode, and releaseTag')
}
def requestedGitTag = System.getenv('GIT_TAG')
if (requestedGitTag && requestedGitTag != releaseTag) {
    throw new GradleException("GIT_TAG ${requestedGitTag} does not match version manifest ${releaseTag}")
}

def syncSupportedRomHashes = tasks.register('syncSupportedRomHashes', Copy) {
    from rootProject.file('../docs/supportedHashes.json')
    into generatedCanonicalAssets
}
def syncTorchExtractorAssets = tasks.register('syncTorchExtractorAssets', Copy) {
    from rootProject.file('../soh/assets/yml')
    into generatedCanonicalAssets.map { it.dir('assets') }
}
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    ndkVersion "29.0.14206865"
    namespace 'com.dishii.soh'
    compileSdkVersion 31
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        if (buildAsApplication) {
            applicationId "com.dishii.soh.test"
        }
        minSdkVersion 24
        targetSdkVersion 33
        versionCode androidVersionCode
        versionName androidVersionName
    }
    signingConfigs {
        release {
            if (project.hasProperty('storeFile')) {
                storeFile file(storeFile)
                storePassword project.storePassword
                keyAlias project.keyAlias
                keyPassword project.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    targets 'soh'
                    arguments "-DSDL_SHARED=ON", "-DANDROID_STL=c++_static", "-DHAVE_LD_VERSION_SCRIPT=OFF",'-DUSE_OPENGLES=ON', "-DBUILD_REMOTE_CONTROL=1"
                    abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
                }
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            debuggable false
            jniDebuggable false
            if (project.hasProperty('storeFile')) {
                signingConfig signingConfigs.release
            }
            externalNativeBuild {
                cmake {
                    targets 'soh'
                    arguments "-DSDL_SHARED=ON", "-DANDROID_STL=c++_static", "-DHAVE_LD_VERSION_SCRIPT=OFF",'-DUSE_OPENGLES=ON', "-DBUILD_REMOTE_CONTROL=1"
                    abiFilters 'arm64-v8a'
                }
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
        variant.outputs.all { output ->
            def projectName = rootProject.name
            def buildType = variant.buildType.name
            def versionName = variant.versionName
            def versionCode = variant.versionCode

            def newApkName = "Shipwright-Android-Dual-Screen-Bleeding-Edge-${releaseTag}.apk"
            outputFileName = newApkName
        }
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            //ndkBuild {
            //    path 'jni/Android.mk'
            //}
            cmake {
                 path '../../CMakeLists.txt'
                 version "3.31.5"
            }
        }
    }
    sourceSets.main.assets.srcDir(generatedCanonicalAssets)
    sourceSets.main.assets.exclude('assets/extractor/**')
    lintOptions {
        abortOnError false
    }
    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core:1.7.0' // Use the latest version
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.12'
    testImplementation 'junit:junit:4.13.2'
}

tasks.configureEach { task ->
    def mergesAssets = task.name.startsWith('merge') && task.name.endsWith('Assets')
    def consumesAssetsDuringLint = task.name.toLowerCase().contains('lint')
    if (mergesAssets || consumesAssetsDuringLint) {
        task.dependsOn(syncSupportedRomHashes)
        task.dependsOn(syncTorchExtractorAssets)
    }
}

task wrapper(type: Wrapper) {
    gradleVersion = '9.8.0'
}

task prepareKotlinBuildScriptModel {
}

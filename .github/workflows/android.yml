name: Android tests and release candidate

on:
  push:
    branches: [main, thor-trackers]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-2022
    env:
      HAS_THOR_KEY: ${{ secrets.THOR_KEYSTORE_B64 != '' }}
    steps:
      - name: Check out source and Android submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply Thor libultraship patches
        shell: pwsh
        run: |
          Get-ChildItem patches -Filter 'libultraship-*.patch' | Sort-Object Name | ForEach-Object {
            git -C libultraship apply --verbose --ignore-whitespace "../patches/$($_.Name)"
            if ($LASTEXITCODE -ne 0) { throw "patch failed: $($_.Name)" }
          }

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android build packages
        shell: pwsh
        run: |
          sdkmanager 'platforms;android-31' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.31.5'

      - name: Build and test the unsigned Android candidate
        shell: pwsh
        run: |
          ./scripts/android/Build-WindowsAndroidRelease.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -WorkingRoot (Join-Path $env:RUNNER_TEMP 'w') `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'windows-native-output')

      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@v4
        with:
          name: shipwright-android-unsigned-${{ github.sha }}
          path: windows-native-output/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Sign the release candidate with the personal Thor key
        if: ${{ env.HAS_THOR_KEY == 'true' }}
        shell: pwsh
        env:
          THOR_KEYSTORE_B64: ${{ secrets.THOR_KEYSTORE_B64 }}
          THOR_KEYSTORE_PASS: ${{ secrets.THOR_KEYSTORE_PASS }}
        run: |
          # Secrets pasted from a text editor can carry a BOM, spaces or a trailing newline.
          $env:THOR_KEYSTORE_PASS = ($env:THOR_KEYSTORE_PASS -replace '[^\x21-\x7E]', '')
          $keystoreB64 = ($env:THOR_KEYSTORE_B64 -replace '[^A-Za-z0-9+/=]', '')
          Write-Host "Password length after cleanup: $($env:THOR_KEYSTORE_PASS.Length) (expected 24); keystore base64 length: $($keystoreB64.Length) (expected 3472)"
          $keystore = Join-Path $env:RUNNER_TEMP 'thor-soh.jks'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($keystoreB64))
          $buildTools = Join-Path $env:ANDROID_SDK_ROOT 'build-tools\35.0.0'
          $apk = Get-ChildItem -LiteralPath 'windows-native-output' -Filter '*.apk' | Select-Object -First 1
          $signed = Join-Path 'windows-native-output' ('thor-signed-' + $apk.Name)
          & (Join-Path $buildTools 'apksigner.bat') sign --ks $keystore --ks-key-alias thorsoh `
            --ks-pass env:THOR_KEYSTORE_PASS --key-pass env:THOR_KEYSTORE_PASS --out $signed $apk.FullName
          if ($LASTEXITCODE -ne 0) { throw 'apksigner sign failed' }
          & (Join-Path $buildTools 'apksigner.bat') verify --verbose $signed
          if ($LASTEXITCODE -ne 0) { throw 'apksigner verify failed' }
          Remove-Item -LiteralPath $keystore -Force

      - name: Upload signed APK
        if: ${{ env.HAS_THOR_KEY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: thor-signed-${{ github.sha }}
          path: windows-native-output/thor-signed-*.apk
          if-no-files-found: error
          retention-days: 14
